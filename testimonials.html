    <style>
        .testimonials-page {
            padding: 40px 0 80px;
        }

        .testimonials-page .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .testimonials-page .page-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .testimonials-page .page-header p {
            font-size: 1.15rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        .testimonials-page .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #6c5ce7;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .testimonials-page .back-link:hover {
            color: #a29bfe;
            transform: translateX(-5px);
        }

        .category-section {
            margin-bottom: 60px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid #6c5ce7;
        }

        .category-header i {
            font-size: 1.5rem;
            color: #6c5ce7;
        }

        .category-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
        }

        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
        }

        .testimonial-card {
            background: #fff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .testimonial-card .quote-icon {
            font-size: 2rem;
            color: #6c5ce7;
            opacity: 0.3;
            margin-bottom: 15px;
            line-height: 1;
        }

        .testimonial-card .context-tag {
            display: inline-block;
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }

        .testimonial-card .quote-text {
            font-size: 1.02rem;
            line-height: 1.7;
            color: #444;
            flex-grow: 1;
            margin-bottom: 25px;
        }

        .testimonial-card .quote-text.expandable {
            max-height: 160px;
            overflow: hidden;
            position: relative;
        }

        .testimonial-card .quote-text.expandable::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(transparent, #fff);
        }

        .testimonial-card .quote-text.expanded {
            max-height: none;
        }

        .testimonial-card .quote-text.expanded::after {
            display: none;
        }

        .testimonial-card .read-more {
            background: none;
            border: none;
            color: #6c5ce7;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .testimonial-card .read-more:hover {
            color: #a29bfe;
        }

        .testimonial-card .provider {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .testimonial-card .provider img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .testimonial-card .provider .avatar-initials {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #6c5ce7, #00d4ff);
        }
        .testimonial-card .provider .avatar-initials.coral {
            background: linear-gradient(135deg, #ff8fab, #ffc857);
        }
        .testimonial-card .provider .avatar-initials.mint {
            background: linear-gradient(135deg, #2bd4a0, #a29bfe);
        }

        .testimonial-card .provider .info h4 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0 0 3px;
        }

        .testimonial-card .provider .info span {
            font-size: 0.85rem;
            color: #888;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #6c5ce7;
            display: block;
        }

        .stat-item .stat-label {
            font-size: 0.95rem;
            color: #666;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .testimonial-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                gap: 30px;
            }

            .stat-item .stat-number {
                font-size: 2rem;
            }

            .testimonials-page .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="bg-fixed" style="background-image: url(img-new/shape/banner-1.jpg);">

    {{sidebar}}

    <div class="portfolio-page-wrapper">
        <div class="container">
            <div class="testimonials-page">
                <div class="page-header">
                    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
                    <h1>What People Are Saying</h1>
                    <p>Feedback from workshop attendees, students, colleagues, and educators who have worked with Paul.</p>
                </div>

                <div class="stats-bar" aria-label="Testimonial statistics">
                    <div class="stat-item">
                        <span class="stat-number" data-testimonial-count>—</span>
                        <span class="stat-label">Testimonials</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" data-testimonial-category-count>—</span>

                    </div>
